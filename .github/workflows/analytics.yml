name: Analytics — số liệu thật từ GitHub API (Every 6h)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GitHub repo stats + traffic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer ${GH_TOKEN}" \
               "https://api.github.com/repos/${REPO}" > repo.json
          curl -s -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer ${GH_TOKEN}" \
               "https://api.github.com/repos/${REPO}/traffic/views" > traffic.json
      - name: Build analytics.json from real data
        run: |
          python3 << 'PY'
          import json, datetime
          repo = json.load(open('repo.json'))
          traffic = json.load(open('traffic.json'))
          data = {
              "updated": datetime.datetime.now().strftime("%d/%m/%Y %H:%M"),
              "github": {
                  "stars": repo.get("stargazers_count",0),
                  "forks": repo.get("forks_count",0),
                  "watchers": repo.get("watchers_count",0),
                  "open_issues": repo.get("open_issues_count",0),
                  "default_branch": repo.get("default_branch","main"),
                  "last_commit_sha": (repo.get("pushed_at") or ""),
              },
              "github_traffic": {
                  "count": traffic.get("count",0),
                  "uniques": traffic.get("uniques",0),
                  "views_14d": traffic.get("views",[]),
              },
              "page_views": traffic.get("count",0),
              "unique_visitors": traffic.get("uniques",0),
              "visitors_7d": [v.get("timestamp","")[:10] for v in traffic.get("views",[])][-7:],
              "form_submissions": 0,
              "sources": {},
              "note": "Số từ GitHub API thật — không bịa. Cập nhật mỗi 6h."
          }
          with open('analytics.json','w') as f: json.dump(data,f,indent=2,ensure_ascii=False)
          print("Real stats:", data["github"], traffic.get("count",0))
          PY
      - name: Commit + push real stats
        run: |
          git config user.name 'Analytics Bot'
          git config user.email 'analytics@aladdin.vn'
          git add analytics.json
          git commit -m "analytics: số thật từ GitHub API $(date +%H:%M)" || echo 'No change'
          git push
