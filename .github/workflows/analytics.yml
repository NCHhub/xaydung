name: Analytics — dữ liệu thật từ GitHub API (Every 6h)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real GitHub stats + update analytics.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json, datetime, os, urllib.request
          path = 'analytics.json'
          repo = os.environ.get('GH_REPO', 'NCHhub/xaydung')
          headers = {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          token = os.environ.get('GH_TOKEN', '')
          if token:
              headers['Authorization'] = 'Bearer ' + token

          def get_json(url):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  print(f'WARN: {url} -> {e}')
                  return {}

          repo_data = get_json(f'https://api.github.com/repos/{repo}')
          traffic = get_json(f'https://api.github.com/repos/{repo}/traffic/views')
          commits = get_json(f'https://api.github.com/repos/{repo}/commits?per_page=1')

          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
          else:
              data = {}

          data['last_updated'] = datetime.datetime.now().strftime('%d/%m/%Y %H:%M')
          data['github'] = {
              'stars': repo_data.get('stargazers_count', 0),
              'forks': repo_data.get('forks_count', 0),
              'watchers': repo_data.get('watchers_count', 0),
              'open_issues': repo_data.get('open_issues_count', 0),
              'default_branch': repo_data.get('default_branch', 'main'),
              'last_commit_sha': (commits[0].get('sha') if commits else ''),
              'last_commit_date': (commits[0].get('commit', {}).get('committer', {}).get('date') if commits else ''),
          }
          data['github_traffic'] = {
              'count': traffic.get('count', 0),
              'uniques': traffic.get('uniques', 0),
              'views_14d': traffic.get('views', []),
          }
          data['page_views'] = traffic.get('count', 0)
          data['unique_visitors'] = traffic.get('uniques', 0)
          data['visitors_7d'] = traffic.get('views', [])[-7:]
          data['sources'] = {}
          for v in traffic.get('views', []):
              day = v.get('timestamp', '')[:10]
              data['sources'][day] = v.get('count', 0)

          with open(path, 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print('Analytics updated from GitHub API:', data.get('github_traffic', {}).get('count', 0))
          PY
      - name: Commit analytics
        run: |
          git config user.name 'Analytics Bot'
          git config user.email 'analytics@aladdin.vn'
          git add analytics.json
          git commit -m "analytics: cập nhật số liệu thật [bot]" || echo 'No new changes'
          git push
