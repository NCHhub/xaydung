# ------------------------------------------------------------
# CÔNG CỤ 1 — Khách đang hỏi gì?
# Câu hỏi thật + câu trả lời ngắn môi giới có thể nói với khách.
# ------------------------------------------------------------
khach-hoi:
  - cau_hoi: "Xây nhà lần đầu thì bắt đầu từ đâu?"
    tra_loi: "Anh/chị cứ yên tâm, việc đầu tiên không phải là chọn nhà thầu. Bắt đầu bằng kiểm tra hồ sơ đất, quy hoạch và thủ tục xin phép trước. Sau đó đi xem 1–2 công trình thật, rồi mới so báo giá theo hạng mục. Em có đội kỹ thuật hướng dẫn từng bước miễn phí."
    slug: "xay-nha-lan-dau-bat-dau-tu-viec-gi"
  - cau_hoi: "Trọn gói hay tự mua vật tư, làm sao an tâm?"
    tra_loi: "Nếu anh/chị không có thời gian, trọn gói là hợp lý — nhưng phải hỏi nhà thầu có ghi nhận kiểm tra vật tư khi nhập kho không. Nếu tự mua, tính cả công sức quản lý của chính mình. Em có thể cho anh/chị xem cách kiểm soát vật tư ở công trình thật."
    slug: "tron-goi-hay-tu-mua-vat-tu"
  - cau_hoi: "Hai báo giá chênh nhau nhiều, chọn bên nào?"
    tra_loi: "Đừng chọn theo tổng tiền. So theo từng hạng mục: cùng danh sách hạng mục, hỏi cả hai bên điền giá rồi đối chiếu chỗ thiếu, chỗ mập mờ. Minh bạch quan trọng hơn rẻ. Gửi báo giá qua cho em, em chỉ cách soi từng hạng mục giúp."
    slug: "hai-bao-gia-khac-nhau-dung-voi-chon-ben-re"
  - cau_hoi: "Ký hợp đồng xây nhà làm sao tránh phát sinh?"
    tra_loi: "Trước khi ký, hỏi nhà thầu 7 câu: giá gồm hạng mục nào, gì chưa bao gồm, vật tư kiểm tra thế nào, nghiệm thu giai đoạn ra sao, phát sinh ai quyết định, tiến độ thế nào, bảo hành ra sao. Em gửi checklist các giai đoạn cần nghiệm thu, dùng được với bất kỳ nhà thầu nào."
    slug: "7-cau-hoi-truoc-khi-ky-hop-dong-xay-nha"
  - cau_hoi: "Đi làm cả ngày, làm sao biết thợ làm đúng?"
    tra_loi: "Không ai bắt mình phải bỏ việc ra trông thợ. Quan trọng là nhà thầu có ghi nhận bằng ảnh/video các công đoạn bịt kín không: vật tư nhập kho, thép trước khi đổ, điện nước trước khi trát. Hỏi đúng câu đó là biết ngay ai làm có hệ thống."
    slug: "di-lam-ca-ngay-khong-the-trong-tho"
  - cau_hoi: "Xây nhà có làm nứt nhà hàng xóm không?"
    tra_loi: "Đó là rủi ro thật với nhà phố. Cách phòng là ghi nhận hiện trạng nhà liền kề trước khi khởi công, có chữ ký hai bên làm căn cứ. Nhà thầu nào chủ động lập biên bản này là biết họ làm nhiều công trình và nắm rủi ro nằm ở đâu."
    slug: "ghi-nhan-hien-trang-nha-hang-xom-truoc-khi-phado"

# ------------------------------------------------------------
# BẢNG GIÁ CHUẨN — TÍNH TỨC THÌ (mọi ngôi nhà dùng cùng công thức)
# Đơn giá VNĐ/m² sàn. Người dùng điền thông số → web tính ngay, không chờ AI.
# Đây là nền thị trường chung 2026. Diamond bổ sung giá riêng kinh nghiệm 21 năm
# bằng cách sửa các con số bên dưới (nguồn kiến thức riêng của Hải).
# ------------------------------------------------------------
bang-gia:
  don-vi: "VNĐ/m² sàn"
  ghi-chu: "Giá tham khảo thị trường 2026. Chưa gồm đất, xin phép, thiết kế, dự phòng. Cần khảo sát thực tế để báo giá chính xác."

  xay-moi:
    # Đơn giá trọn gói thô+hoàn thiện, nhà phố/ống thông dụng (VNĐ/m² sàn)
    khong-gian:
      "Hà Nội": 15000000        # 15tr/m²
      "TP.HCM": 15500000
      "Đà Nẵng": 13500000
      "Tỉnh khác": 12500000
    theo-vat-lieu:            # hệ số nhân theo chất lượng vật liệu
      "Phổ thông": 1.0
      "Khá": 1.2
      "Cao cấp": 1.5

    # ---- DỰ TOÁN TOÀN DIỆN: tách phần thô / phần hoàn thiện ----
    # Tỉ trọng % của phần thô trong đơn giá trọn gói (móng + khung + mái + tường)
    ti-trong-tho: 0.60          # 60% tiền xây là phần thô
    ti-trong-hoan-thien: 0.40   # 40% là hoàn thiện
    # Hệ số theo KẾT CẤU MÁI (nhân vào đơn giá, phần thô)
    he-so-mai:
      "Mái tôn": 0.85
      "Mái bê tông": 1.10
      "Mái thái": 1.25
    # Hệ số theo LOẠI MÓNG (nhân vào phần móng/thô)
    he-so-mong:
      "Móng băng": 1.0
      "Móng đơn giản": 0.85
      "Móng cọc (đất yếu)": 1.25
    # Hệ số theo LOẠI HÌNH
    he-so-loai-hinh:
      "Nhà phố/Nhà ống": 1.0
      "Nhà cấp 4": 0.9
      "Biệt thự": 1.3
    # Chi phí xin phép + thiết kế + các khoản phụ tham khảo
    phi-xin-phep:
      "Nhà ở riêng lẻ (đơn giản)": 15000000    # ~15tr
      "Nhà thay đổi kết cấu": 50000000         # ~50tr (đơn_PDQ02)
      "Nhà phố cao tầng/nhà trọ": 100000000   # ~100tr (giấy phép kinh doanh + quy hoạch)
    phi-thiet-ke:
      "Thiết kế kiến trúc (phổ thông)": 200000    # ~200k/m² sàn
      "Thiết kế kiến trúc (trung bình)": 350000   # ~350k/m² sàn
      "Thiết kế kiến trúc + kết cấu (cao cấp)": 450000  # ~450k/m² sàn
      "Thiết kế cảnh quan (biệt thự)": 150000     # ~150k/m² đất vườn
    phi-giam-sat:
      "Giám sát cơ bản (nhà nhỏ)": 0.03            # 3% giá trị TH
      "Giám sát kỹ thuật (nhà nhiều tầng)": 0.05   # 5% giá trị TH
      "Giám sát độc lập (biệt thự)": 0.08          # 8% giá trị TH
    phi-noi-that:
      "Nội thất cơ bản": 2000000                   # ~2tr/m² sàn
      "Nội thất trung bình": 4000000               # ~4tr/m² sàn
      "Nội thất cao cấp": 8000000                  # ~8tr/m² sàn
    phi-ha-tang:
      "Hạ tầng điện nước (đường mới)": 30000000     # ~30tr khi kéo điện/nước mới
      "Hệ thống năng lượng mặt trời": 50000000     # ~50tr
      "Hệ thống xử lý nước thải": 40000000         # ~40tr
    phi-tho-moi:
      "Phá dỡ nhà cũ (40-80m²)": 30000000          # ~30tr (tùy kết cấu)
      "Phá dỡ nhà cũ (>80m²)": 50000000            # ~50tr
    du-phong: 0.12              # +12% dự phòng phát sinh (xây mới)
    du-phong-nha-cu: 0.25       # +25% dự phòng khi sửa nhà cũ (mở ra mới biết)

  sua-chua:
    # Chi phí sửa chữa theo mức độ, đơn giá/m² sàn hiện trạng
    muc-do:
      "Sửa nhẹ (sơn, sửa nhỏ, thay nội thất)": 2500000     # 2.5tr/m²
      "Sửa vừa (cải tạo, chống thấm, điện nước, trát)": 5000000
      "Sửa lớn (thay kết cấu, nâng tầng, cải tạo triệt để)": 9000000
    # ---- DỰ TOÁN SỬA THEO HẠNG MỤC (cách tính thực tế của Hải) ----
    # Người dùng tick hạng mục cần sửa → cộng tiền từng mục → tổng.
    # Đơn giá là hằng số (VNĐ) hoặc theo đơn vị riêng; "*SAN" = nhân diện tích sàn.
    hang-muc:
      "Sơn lại toàn bộ tường": { "don-vi": "đ/m² tường", "gia": 35000, "he-so-tuong": 2.5 }   # diện tích tường ≈ sàn × 2.5
      "Chống thấm (sân thượng, tường, vệ sinh)": { "don-vi": "đ/m²", "gia": 180000, "he-so-diện": 0.15 }  # ≈ 15% diện tích sàn
      "Thay mới điện nước cơ bản": { "don-vi": "đ/m² sàn", "gia": 350000 }                     # nhân toàn sàn
      "Ốp lát lại nền, tường vệ sinh": { "don-vi": "đ/m²", "gia": 350000, "he-so-diện": 0.4 } # ốp 40% diện tích
      "Thay cửa (all tầng)": { "don-vi": "đ/bộ/tầng", "gia": 8000000, "theo-tang": true }      # mỗi tầng 1 bộ chính
      "Làm lại trần thạch cao": { "don-vi": "đ/m²", "gia": 220000, "he-so-diện": 0.6 }          # trần 60% sàn
      "Vệ sinh WC làm mới": { "don-vi": "đ/phòng", "gia": 15000000, "theo-tang": true }         # mỗi tầng 1 phòng
      "Sửa kết cấu / gia cố": { "don-vi": "đ/m² sàn", "gia": 800000 }                          # tùy chọn thêm
    du-phong-sua: 0.25          # +25% dự phòng phát sinh khi sửa nhà cũ (mở ra mới biết)

  son:
    "Trong nhà": 35000        # /m² tường
    "Ngoài nhà": 55000
    "chu-trong": 20000         # /m² hệ số phần sơn trong

  vat-tu-xi-mang:
    # Số bao xi măng 50kg cho 1m² sàn xây mới (thô cơ bản)
    mac-100: 2.2
    mac-250: 2.6
    mac-300: 3.0

  he-so-tang:                  # hệ số theo số tầng cho tổng diện tích sàn
    "1": 1.0
    "2": 1.15
    "3": 1.25
    "4": 1.35
    "5+": 1.45

  phi-phu:
    "Vật liệu phải khuân tay (ngõ xe máy/ngõ nhỏ)": 0.12   # +12% vận chuyển thủ công
    "Đất nền yếu cần xử lý nền": 0.10
    "Khu vực xa/khó tiếp cận": 0.08

# ------------------------------------------------------------
# CÔNG CỤ 3 — QUY TRÌNH CÔNG TRÌNH (Diamond 02-09, bắt đầu nhỏ: làm ngay, dùng ngay)
# Môi giới điền nhanh loại công trình + diện tích → sinh QUY TRÌNH chi tiết:
#   checklist từng bước + chi phí + thời gian + kinh nghiệm. Chạy ngay, không chờ AI.
# Diamond/Hải bổ sung kinh nghiệm 21 năm vào từng bước theo thực tế.
# ------------------------------------------------------------
quy-trinh:
  # Mỗi loại công trình = 1 quy trình: tổng thời gian + ước chi phí tham khảo + danh sách GIAI ĐOẠN.
  # Mỗi giai đoạn: tiêu đề + thời lượng + danh sách BƯỚC (checklist) kèm thời gian & kinh nghiệm.
  # Nguồn: kinh nghiệm 21 năm Nguyễn Cao Hải. Diamond/Hải bổ sung chỉnh sửa theo thực tế.
  "Xây mới":
    tong-thoi-gian: "6–12 tháng"
    chi-phi: "tham-khao bang-gia xay-moi"
    giai-doan:
      - ten: "Khảo sát & thủ tục"
        thoi-gian: "2–4 tuần"
        buoc:
          - ten: "Kiểm tra hồ sơ đất, quy hoạch, hiện trạng"
            thoi-gian: "1 tuần"
            kinh-nghiem: "Phải làm TRƯỚC khi chọn nhà thầu. Xem thửa đất có nằm trong quy hoạch không, đất có đủ điều kiện xây không."
          - ten: "Xin phép xây dựng (nếu cần)"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Sổ hồng + bản vẽ thiết kế + đơn. Với nhà sửa kết cấu cũng cần xin phép. Thời gian tùy quận/huyện."
      - ten: "Thiết kế & báo giá"
        thoi-gian: "3–6 tuần"
        buoc:
          - ten: "Chọn thiết kế kiến trúc & kết cấu"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Thiết kế tốt giúp tiết kiệm xây dựng. Không nên cắt khâu này."
          - ten: "So báo giá theo hạng mục (không so tổng tiền)"
            thoi-gian: "1–2 tuần"
            kinh-nghiem: "Cùng 1 danh sách hạng mục, yêu cầu 2–3 nhà thầu điền giá rồi đối chiếu chỗ thiếu/chỗ mập mờ."
      - ten: "Thi công"
        thoi-gian: "3–9 tháng"
        buoc:
          - ten: "Móng & phần thô"
            thoi-gian: "1,5–3 tháng"
            kinh-nghiem: "Ghi nhận ảnh thép trước khi đổ bê tông, nghiệm thu móng trước khi lấp."
          - ten: "Xây tô, điện nước trong tường"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Chụp ảnh điện nước TRƯỚC khi trát — sau này muốn sửa rất khó."
          - ten: "Hoàn thiện: sơn, nền, cửa, vệ sinh"
            thoi-gian: "1–2,5 tháng"
            kinh-nghiem: "Nghiệm thu từng phòng trước khi bàn giao, lập biên bản bảo hành."
    note: "Vướng móng cọc, ngõ khuân tay, mua vật tư chậm → kéo dài thêm."

  "Sửa nhẹ":
    tong-thoi-gian: "3–5 tuần"
    chi-phi: "tham-khao bang-gia sua-chua muc-do 'Sửa nhẹ'"
    giai-doan:
      - ten: "Khảo sát & chuẩn bị"
        thoi-gian: "1–2 tuần"
        buoc:
          - ten: "Xác định hạng mục sửa, khảo sát hiện trạng"
            thoi-gian: "1 tuần"
            kinh-nghiem: "Chụp ảnh hiện trạng, liệt kê đủ hạng mục để tránh phát sinh."
          - ten: "Chuẩn bị vật tư, sắp xếp chỗ ở tạm nếu cần"
            thoi-gian: "1 tuần"
            kinh-nghiem: "Sửa trong khi ở lại → lên kế hoạch khu vực thi công trước."
      - ten: "Thi công"
        thoi-gian: "1–3 tuần"
        buoc:
          - ten: "Sơn, sửa nhỏ, chống thấm"
            thoi-gian: "1–2 tuần"
            kinh-nghiem: "Sơn trong nhà cần trám vết nứt, sơn lót đủ. Chống thấm sân thượng phải xử lý kỹ gốc rễ."
          - ten: "Nghiệm thu & dọn dẹp"
            thoi-gian: "3–7 ngày"
            kinh-nghiem: "Kiểm tra lại chỗ thấm sau mưa trước khi thanh toán hết."
    note: "Phát sinh mở ra mới biết là bình thường (20–30%)."

  "Sửa vừa (cải tạo)":
    tong-thoi-gian: "1,5–3 tháng"
    chi-phi: "tham-khao bang-gia sua-chua muc-do 'Sửa vừa'"
    giai-doan:
      - ten: "Khảo sát & chuẩn bị"
        thoi-gian: "1–3 tuần"
        buoc:
          - ten: "Khảo sát kết cấu + hạng mục cải tạo"
            thoi-gian: "1–2 tuần"
            kinh-nghiem: "Cải tạo thường đụng kết cấu → khảo sát kỹ trước, đừng đoán."
          - ten: "Xin phép nếu thay kết cấu, lên báo giá chi tiết"
            thoi-gian: "1–3 tuần"
            kinh-nghiem: "Có xây sửa kết cấu là cần xin phép; làm trước để không bị đình chỉ."
      - ten: "Thi công"
        thoi-gian: "1–2 tháng"
        buoc:
          - ten: "Phá dỡ + ghi nhận hiện trạng nhà liền kề"
            thoi-gian: "1–2 tuần"
            kinh-nghiem: "Lập biên bản hiện trạng nhà hàng xóm, có chữ ký 2 bên trước khi phá dỡ — tránh tranh chấp nứt vỡ."
          - ten: "Điện nước, trát, chống thấm"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Điện nước trong tường phải chụp ảnh trước khi trát."
          - ten: "Hoàn thiện & nghiệm thu"
            thoi-gian: "2–3 tuần"
            kinh-nghiem: "Nghiệm thu từng phần, đối chiếu đúng danh mục báo giá."
    note: "Đụng kết cấu/thay tầng → có thể 3–6 tháng."

  "Sửa lớn (thay kết cấu, nâng tầng)":
    tong-thoi-gian: "4–8 tháng"
    chi-phi: "tham-khao bang-gia sua-chua muc-do 'Sửa lớn'"
    giai-doan:
      - ten: "Khảo sát & thủ tục"
        thoi-gian: "1–2 tháng"
        buoc:
          - ten: "Khảo sát địa chất + kết cấu hiện hữu"
            thoi-gian: "1–3 tuần"
            kinh-nghiem: "Nâng tầng/thay kết cấu phải khảo sát để tính toán chính xác."
          - ten: "Xin phép xây dựng, thiết kế kết cấu"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Bắt buộc có thiết kế kết cấu của kỹ sư, xin phép đúng quy định."
      - ten: "Thi công"
        thoi-gian: "3–6 tháng"
        buoc:
          - ten: "Gia cố, thi công kết cấu mới"
            thoi-gian: "1,5–3 tháng"
            kinh-nghiem: "Theo dõi sát kỹ thuật thi công, nghiệm thu móng/cột/dầm."
          - ten: "Xây tô, điện nước, hoàn thiện"
            thoi-gian: "1,5–3 tháng"
            kinh-nghiem: "Ghi nhận ảnh các công đoạn bịt kín — thứ sau này không nhìn lại được."
    note: "Là công trình nặng → nên để đội kỹ thuật giám sát."

  "Sơn & chống thấm":
    tong-thoi-gian: "1–3 tuần"
    chi-phi: "tham-khao bang-gia son"
    giai-doan:
      - ten: "Chuẩn bị"
        thoi-gian: "1 tuần"
        buoc:
          - ten: "Khảo sát bề mặt, trám vết nứt, vệ sinh tường"
            thoi-gian: "2–4 ngày"
            kinh-nghiem: "Sơn đẹp phụ thuộc khâu chuẩn bị bề mặt, không phải khâu quét sơn."
      - ten: "Thi công"
        thoi-gian: "1–2 tuần"
        buoc:
          - ten: "Sơn lót + sơn phủ"
            thoi-gian: "1 tuần"
            kinh-nghiem: "Đủ 2 lớp phủ, đúng thời gian khô giữa các lớp."
          - ten: "Chống thấm (nếu có) + nghiệm thu"
            thoi-gian: "3–5 ngày"
            kinh-nghiem: "Chống thấm test sau mưa mới chắc."
  "Nhà cấp 4":
    tong-thoi-gian: "3–6 tháng"
    chi-phi: "tham-khao bang-gia xay-moi"
    giai-doan:
      - ten: "Khảo sát & thủ tục"
        thoi-gian: "2–4 tuần"
        buoc:
          - ten: "Kiểm tra hồ sơ đất, quy hoạch, hiện trạng"
            thoi-gian: "1 tuần"
            kinh-nghiem: "Cấp 4 thường đất thổ cư sẵn — kiểm tra sổ, quy hoạch, chỉ giới xây dựng."
          - ten: "Xin phép xây dựng (hầu hết cấp 4 cần)"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Cấp 4 có móng cột vẫn cần xin phép; thời gian tùy quận/huyện."
      - ten: "Thi công"
        thoi-gian: "2–4 tháng"
        buoc:
          - ten: "Móng & phần thô (đổ cột, đà, mái)"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Nghiệm thu móng trước khi lấp; chụp ảnh thép trước khi đổ bê tông."
          - ten: "Xây tô, mái, điện nước"
            thoi-gian: "1–1,5 tháng"
            kinh-nghiem: "Mái tôn chống nóng cần xử lý chống dột kỹ; điện nước chụp ảnh trước khi trát."
          - ten: "Hoàn thiện: sơn, nền, cửa, vệ sinh"
            thoi-gian: "1–1,5 tháng"
            kinh-nghiem: "Nghiệm thu từng phòng trước khi bàn giao."
    note: "Cấp 4 diện tích nhỏ, thi công nhanh hơn nhà nhiều tầng. Vướng ngõ hẻm → phát sinh khuân tay."

  "Nhà ống nhiều tầng":
    tong-thoi-gian: "8–14 tháng"
    chi-phi: "tham-khao bang-gia xay-moi (cao hơn nhà 1 tầng)"
    giai-doan:
      - ten: "Khảo sát & thủ tục"
        thoi-gian: "1–2 tháng"
        buoc:
          - ten: "Khảo sát địa chất + thiết kế kiến trúc/kết cấu"
            thoi-gian: "3–6 tuần"
            kinh-nghiem: "Nhà cao tầng bắt buộc thiết kế kết cấu của kỹ sư, khảo sát địa chất nếu đất yếu."
          - ten: "Xin phép xây dựng + giấy phép"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Nhà ống 3-5 tầng cần đầy đủ hồ sơ, có thể cần chấp thuận quy hoạch."
      - ten: "Thi công"
        thoi-gian: "6–10 tháng"
        buoc:
          - ten: "Móng & cọc (nếu cần) + phần thô từng tầng"
            thoi-gian: "3–5 tháng"
            kinh-nghiem: "Đổ tầng nào nghiệm thu tầng đó; ghi nhận ảnh thép trước đổ bê tông."
          - ten: "Xây tô, điện nước, thang bộ"
            thoi-gian: "2–3 tháng"
            kinh-nghiem: "Điện nước trong tường chụp ảnh trước khi trát; trục thang bộ thi công kỹ."
          - ten: "Hoàn thiện từng tầng + nghiệm thu"
            thoi-gian: "2–3 tháng"
            kinh-nghiem: "Nhà nhiều tầng phức tạp — nên có giám sát kỹ thuật."
    note: "Nhà ống cao tầng thi công lâu, cần giám sát chặt. Vướng hẻm nhỏ, khuân tay → kéo dài + tốn thêm."

  "Biệt thự":
    tong-thoi-gian: "1–1,5 năm"
    chi-phi: "tham-khao bang-gia xay-moi (mức cao — hoàn thiện cao cấp)"
    giai-doan:
      - ten: "Khảo sát & thiết kế"
        thoi-gian: "1–2 tháng"
        buoc:
          - ten: "Khảo sát địa chất + lên phối cảnh, thiết kế chi tiết"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Biệt thự cần thiết kế cảnh quan + kiến trúc + kết cấu bài bản trước khi thi công."
          - ten: "Xin phép + chốt báo giá theo hạng mục"
            thoi-gian: "3–6 tuần"
            kinh-nghiem: "Biệt thự có vườn, tường rào, cổng — so báo giá đủ hạng mục."
      - ten: "Thi công"
        thoi-gian: "9–12 tháng"
        buoc:
          - ten: "Móng, cọc, khung"
            thoi-gian: "3–4 tháng"
            kinh-nghiem: "Thi công móng biệt thự thường nặng nề; nghiệm thu kỹ từng giai đoạn."
          - ten: "Thô tầng, xây, điện nước, mái"
            thoi-gian: "3–4 tháng"
            kinh-nghiem: "Chụp ảnh điện nước trước trát; mái chống thấm kỹ."
          - ten: "Hoàn thiện cao cấp + cảnh quan + nghiệm thu"
            thoi-gian: "3–4 tháng"
            kinh-nghiem: "Cao cấp nên thuê giám sát độc lập; nghiệm thu từng hạng mục."
    note: "Biệt thự đòi hỏi chuyên môn cao, ngân sách lớn — nên để đội kỹ thuật giám sát chặt."

  "Nhà trọ cho thuê":
    tong-thoi-gian: "2–4 tháng"
    chi-phi: "tham-khao bang-gia xay-moi (mức phổ thông, tiết kiệm)"
    giai-doan:
      - ten: "Khảo sát & thủ tục"
        thoi-gian: "2–4 tuần"
        buoc:
          - ten: "Khảo sát đất, quy hoạch, vị trí cho thuê"
            thoi-gian: "1 tuần"
            kinh-nghiem: "Tính kỹ số phòng tối đa theo diện tích + lối đi riêng cho từng phòng."
          - ten: "Xin phép xây dựng nhà trọ"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Nhà trọ nhiều phòng cần hồ sơ rõ ràng để sau này xin giấy phép kinh doanh."
      - ten: "Thi công"
        thoi-gian: "1,5–3 tháng"
        buoc:
          - ten: "Phần thô, tường ngăn phòng, mái"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Ngăn phòng phải đủ cách âm, chống cháy; vệ sinh chung mỗi tầng."
          - ten: "Điện nước riêng từng phòng + đồng hồ"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Đồng hồ điện nước riêng từng phòng là tiêu chí chọn trọ."
          - ten: "Hoàn thiện + nghiệm thu + lắp nội thất cơ bản"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Nghiệm thu trước khi cho thuê; bàn giao bơm nước, bồn chứa."
    note: "Nhà trọ tiết kiệm hợp lý nhưng phải đủ cách âm, chống cháy, điện nước riêng — kiếm khách dễ."

  "Thêm tầng":
    tong-thoi-gian: "3–6 tháng"
    chi-phi: "tham-khao bang-gia sua-chua (mức Sửa lớn)"
    giai-doan:
      - ten: "Khảo sát & thủ tục"
        thoi-gian: "1–2 tháng"
        buoc:
          - ten: "Khảo sát kết cấu nhà hiện hữu + địa chất"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Bắt buộc kiểm tra móng, cột, dầm có chịu nổi thêm tầng không — đừng đoán."
          - ten: "Thiết kế kết cấu + xin phép xây dựng"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Thêm tầng phải có thiết kế kết cấu của kỹ sư + xin phép, nếu không bị phạt/đình chỉ."
      - ten: "Thi công"
        thoi-gian: "2–4 tháng"
        buoc:
          - ten: "Gia cố nền móng, cột nếu cần"
            thoi-gian: "1–2 tháng"
            kinh-nghiem: "Gia cố phải theo đúng thiết kế; nghiệm thu trước khi đắp tầng."
          - ten: "Đổ khung tầng mới + xây tô"
            thoi-gian: "2–3 tháng"
            kinh-nghiem: "Theo dõi sát kết nối tầng mới với nhà cũ."
          - ten: "Điện nước, hoàn thiện, nghiệm thu"
            thoi-gian: "1–1,5 tháng"
            kinh-nghiem: "Kiểm tra chống thấm tại vị trí chuyển tiếp tầng."
    note: "Phụ thuộc tình trạng nhà hiện hữu — khảo sát kết cấu là BẮT BUỘC trước, không đoán."

  "Làm mái tôn":
    tong-thoi-gian: "1–2 tuần"
    chi-phi: "tham-khao bang-gia xay-moi hoàn thiện (mái)"
    giai-doan:
      - ten: "Khảo sát & chuẩn bị"
        thoi-gian: "2–4 ngày"
        buoc:
          - ten: "Đo diện tích mái, chọn loại tôn + xà gồ"
            thoi-gian: "1–2 ngày"
            kinh-nghiem: "Chọn tôn dày đủ, xà gồ đúng bước; tính độ dốc mái thoát nước."
          - ten: "Xin phép nếu thay kết cấu mái (nếu cần)"
            thoi-gian: "vài ngày"
            kinh-nghiem: "Chỉ thay tôn thay xà gồ thường không cần; đổi kết cấu mái nặng thì hỏi phường."
      - ten: "Thi công"
        thoi-gian: "1 tuần"
        buoc:
          - ten: "Tháo mái cũ + thi công xà gồ, chống dột"
            thoi-gian: "2–3 ngày"
            kinh-nghiem: "Gia cố lớp chống dột, chống nóng (phủ bạt/phu nhũ) trước khi lợp tôn."
          - ten: "Lợp tôn + bắn vít + hoàn thiện máng xối"
            thoi-gian: "2–3 ngày"
            kinh-nghiem: "Bắn vít đủ, chống dột tại lỗ vít; kiểm tra máng xối hướng thoát."
          - ten: "Nghiệm thu sau mưa"
            thoi-gian: "1 ngày"
            kinh-nghiem: "Chỉ chốt khi qua 1 trận mưa không dột."
    note: "Làm mái tôn nhanh nhưng phải chống nóng + chống dột kỹ — đừng ham rẻ."

  "Chống thấm sân thượng":
    tong-thoi-gian: "1–2 tuần"
    chi-phi: "tham-khao bang-gia son/sua-chua (hạng mục chống thấm)"
    giai-doan:
      - ten: "Chuẩn bị"
        thoi-gian: "3–5 ngày"
        buoc:
          - ten: "Khảo sát vị trí thấm, xử lý bề mặt, vệ sinh sạch"
            thoi-gian: "2–3 ngày"
            kinh-nghiem: "Chống thấm thất bại do bề mặt không sạch/khô — làm kỹ bước này."
      - ten: "Thi công"
        thoi-gian: "5–7 ngày"
        buoc:
          - ten: "Quét lớp chống thấm gốc xi măng/bitum đúng kỹ thuật"
            thoi-gian: "3–4 ngày"
            kinh-nghiem: "Đủ số lớp, đúng thời gian khô giữa các lớp; xử lý chân tường, khe nứt."
          - ten: "Lớp bảo vệ + nghiệm thu sau mưa"
            thoi-gian: "2–3 ngày"
            kinh-nghiem: "Test nước/mưa vài ngày mới chốt; lên lớp bảo vệ để không bịt hỏng."
    note: "Tìm đúng vị trí thấm gốc (không chỉ phủ bề mặt), làm đủ lớp, test sau mưa."

  "Cải tạo phòng vệ sinh":
    tong-thoi-gian: "1–2 tuần"
    chi-phi: "tham-khao bang-gia sua-chua (hạng mục WC)"
    giai-doan:
      - ten: "Khảo sát & chuẩn bị"
        thoi-gian: "2–3 ngày"
        buoc:
          - ten: "Xác định hạng mục: thay thiết bị, chống thấm, thay ống, làm lại nền"
            thoi-gian: "1 ngày"
            kinh-nghiem: "Phòng WC hay thấm/chập do ống cũ — kiểm tra trước khi quyết định làm gì."
      - ten: "Thi công"
        thoi-gian: "1–2 tuần"
        buoc:
          - ten: "Phá dỡ, chống thấm nền + tường"
            thoi-gian: "3–5 ngày"
            kinh-nghiem: "Chống thấm sàn WC là quan trọng nhất — thiếu là thấm xuống nhà dưới."
          - ten: "Thay ống, lát nền, lắp thiết bị vệ sinh"
            thoi-gian: "4–7 ngày"
            kinh-nghiem: "Chọn thiết bị bền, kiểm tra độ dốc thoát nước."
          - ten: "Nghiệm thu, test kín nước"
            thoi-gian: "1 ngày"
            kinh-nghiem: "Bơm nước đọng kiểm tra chống thấm trước khi bàn giao."
    note: "Chống thấm sàn + test kín nước là 2 việc không được bỏ qua."

  "Lắp thang máy gia đình":
    tong-thoi-gian: "1–2 tháng"
    chi-phi: "tham-khao riêng (thiết bị + lắp đặt theo hãng)"
    giai-doan:
      - ten: "Khảo sát & chuẩn bị"
        thoi-gian: "2–4 tuần"
        buoc:
          - ten: "Khảo sát vị trí hố thang + tải trọng kết cấu"
            thoi-gian: "1–2 tuần"
            kinh-nghiem: "Chọn vị trí hố thang + kiểm tra kết cấu chịu lực, đối chiếu kích thước nhà."
          - ten: "Chọn hãng, báo giá, đặt trước thiết bị"
            thoi-gian: "1–3 tuần"
            kinh-nghiem: "Chọn hãng có bảo hành dài + tổng thầu thi công hố thang phối hợp."
      - ten: "Thi công"
        thoi-gian: "3–6 tuần"
        buoc:
          - ten: "Thi công hố thang, đà kiềng, chống thấm"
            thoi-gian: "2–4 tuần"
            kinh-nghiem: "Hố thang phải kín, chống thấm, chống ồn cho các phòng liền kề."
          - ten: "Lắp ray, cabin, cửa tầng"
            thoi-gian: "1–2 tuần"
            kinh-nghiem: "Bắt buộc đơn vị có chứng chỉ lắp đặt + nghiệm thu an toàn."
          - ten: "Kiểm định an toàn + bàn giao"
            thoi-gian: "vài ngày"
            kinh-nghiem: "Kiểm định + hướng dẫn sử dụng bảo trì; lưu hồ sơ bảo hành."
    note: "Thang máy là thiết bị an toàn — bắt buộc đơn vị uy tín + có nghiệm thu, không tự sửa."

