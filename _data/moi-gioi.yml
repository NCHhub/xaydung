# Biến số nhận diện → điều chỉnh quy trình linh hoạt (thêm bước/cảnh báo cho đúng ca)
quy-trinh-bien-so:
  ngheo:
    keywords: ["hẻm","ngõ","ngõ nhỏ","hẻm nhỏ","xe máy","khuân tay","ngõ xe máy","đường nhỏ","ngõ hẹp"]
    hanh-dong: "Vật liệu phải khuân tay qua ngõ nhỏ → cộng 10–15% chi phí vận chuyển, thời gian kéo dài hơn. Chủ trì vận chuyển theo giờ không cản trở lối đi."
  dat-cu:
    keywords: ["nhà cũ","đất cũ","nhà đã có","cải tạo nhà cũ","nhà củ","cải tạo","sửa nhà cũ"]
    # đã có loại cải tạo — biến số này thêm ghi chú
