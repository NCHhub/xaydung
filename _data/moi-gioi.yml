# ------------------------------------------------------------
# CÔNG CỤ 1 — Khách đang hỏi gì?
# Câu hỏi thật + câu trả lời ngắn môi giới có thể nói với khách.
# ------------------------------------------------------------
khach-hoi:
  - cau_hoi: "Xây nhà lần đầu thì bắt đầu từ đâu?"
    tra_loi: "Anh/chị cứ yên tâm, việc đầu tiên không phải là chọn nhà thầu. Bắt đầu bằng kiểm tra hồ sơ đất, quy hoạch và thủ tục xin phép trước. Sau đó đi xem 1–2 công trình thật, rồi mới so báo giá theo hạng mục. Em có đội kỹ thuật hướng dẫn từng bước miễn phí."
    slug: "xay-nha-lan-dau-bat-dau-tu-viec-gi"
  - cau_hoi: "Trọn gói hay tự mua vật tư, làm sao an tâm?"
    tra_loi: "Nếu anh/chị không có thời gian, trọn gói là hợp lý — nhưng phải hỏi nhà thầu có ghi nhận kiểm tra vật tư khi nhập kho không. Nếu tự mua, tính cả công sức quản lý của chính mình. Em có thể cho anh/chị xem cách kiểm soát vật tư ở công trình thật."
    slug: "tron-goi-hay-tu-mua-vat-tu"
  - cau_hoi: "Hai báo giá chênh nhau nhiều, chọn bên nào?"
    tra_loi: "Đừng chọn theo tổng tiền. So theo từng hạng mục: cùng danh sách hạng mục, hỏi cả hai bên điền giá rồi đối chiếu chỗ thiếu, chỗ mập mờ. Minh bạch quan trọng hơn rẻ. Gửi báo giá qua cho em, em chỉ cách soi từng hạng mục giúp."
    slug: "hai-bao-gia-khac-nhau-dung-voi-chon-ben-re"
  - cau_hoi: "Ký hợp đồng xây nhà làm sao tránh phát sinh?"
    tra_loi: "Trước khi ký, hỏi nhà thầu 7 câu: giá gồm hạng mục nào, gì chưa bao gồm, vật tư kiểm tra thế nào, nghiệm thu giai đoạn ra sao, phát sinh ai quyết định, tiến độ thế nào, bảo hành ra sao. Em gửi checklist các giai đoạn cần nghiệm thu, dùng được với bất kỳ nhà thầu nào."
    slug: "7-cau-hoi-truoc-khi-ky-hop-dong-xay-nha"
  - cau_hoi: "Đi làm cả ngày, làm sao biết thợ làm đúng?"
    tra_loi: "Không ai bắt mình phải bỏ việc ra trông thợ. Quan trọng là nhà thầu có ghi nhận bằng ảnh/video các công đoạn bịt kín không: vật tư nhập kho, thép trước khi đổ, điện nước trước khi trát. Hỏi đúng câu đó là biết ngay ai làm có hệ thống."
    slug: "di-lam-ca-ngay-khong-the-trong-tho"
  - cau_hoi: "Xây nhà có làm nứt nhà hàng xóm không?"
    tra_loi: "Đó là rủi ro thật với nhà phố. Cách phòng là ghi nhận hiện trạng nhà liền kề trước khi khởi công, có chữ ký hai bên làm căn cứ. Nhà thầu nào chủ động lập biên bản này là biết họ làm nhiều công trình và nắm rủi ro nằm ở đâu."
    slug: "ghi-nhan-hien-trang-nha-hang-xom-truoc-khi-phado"

