<script>
(function(){
  var btn = document.getElementById('zaloFloat');
  if(!btn) return;
  var loiNhan = "Hải, cùng gia tăng giá trị của nhau nhé.";
  btn.addEventListener('click', function(e){
    // Sao chép lời nhắn vào bộ nhớ để khách dán vào khung chat Zalo
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(loiNhan).then(function(){
          hienToast('Đã sao chép lời nhắn. Dán vào ô chat và gửi giúp anh nhé! 💬');
        });
      } else {
        // Dự phòng cho trình duyệt cũ
        var ta = document.createElement('textarea');
        ta.value = loiNhan;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); hienToast('Đã sao chép lời nhắn. Dán vào ô chat và gửi giúp anh nhé! 💬'); }
        catch(err){}
        document.body.removeChild(ta);
      }
    } catch(e){}
  });

  function hienToast(msg){
    var t = document.getElementById('zaloToast');
    if(!t){
      t = document.createElement('div');
      t.id = 'zaloToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.94);color:#fff;padding:12px 20px;border-radius:12px;font-size:.92rem;z-index:10000;opacity:0;transition:opacity .25s,transform .25s;max-width:calc(100vw - 40px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25);';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(function(){
      t.style.opacity = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 3200);
  }
})();
</script>
